aid: hustle-fund
name: Hustle Fund
description: 'Hustle Fund is a pre-seed and seed-stage venture capital firm that invests
  in "hilariously early" software and technology startups, backing founders often within
  one or two meetings. Beyond writing early checks through its funds and angel investor
  network, Hustle Fund publishes tactical, BS-free educational content and newsletters
  for founders (The Founder Playbook) and investors (Small Bets), and runs programs
  that help operators learn to angel invest. It was surfaced in the API Evangelist
  network as a portfolio company of foundry-group. Sector: venture-capital.'
